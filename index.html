    <noscript>
      <h1>Ayu — her daily 5-minute pregnancy talk</h1>
      <p>A demo web app: a pregnant woman has a 5-minute talk with Ayu every day. Ayu asks doctor-style questions as tap-to-answer cards, falls back to a normal phone call on weak networks, builds her birth and travel plan, and prepares a 2-minute summary for her doctor. Fixed safety rules, not the AI, decide when she should see someone. All data is mock — no real patients. Please enable JavaScript.</p>
